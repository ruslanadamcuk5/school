{% extends "base.html" %}
{% block title %}Вход в профиль{% endblock %}
{% block content %}

<section class="card card--pad-lg mt-3" style="max-width:420px; margin-left:auto; margin-right:auto;">
  <div class="center">
    <span class="avatar avatar--lg">{{ learner.avatar }}</span>
    <h1 class="mt-1">{{ learner.name }}</h1>
    <p class="muted small">{{ learner.grade }} класс</p>
  </div>

  {% if error %}
    <div class="flash flash--error mt-2">{{ error }}</div>
  {% endif %}

  <form method="post" action="{{ url_for('main.login_learner', learner_id=learner.id) }}" class="mt-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="pin">PIN-код профиля</label>
      <input id="pin" name="pin" inputmode="numeric" pattern="\d{4}" maxlength="4"
             required autofocus autocomplete="off" placeholder="••••">
    </div>
    <button class="btn btn--lg btn--block" type="submit">Войти</button>
  </form>

  <p class="center mt-3">
    <a class="btn btn--ghost btn--small" href="{{ url_for('main.welcome') }}">← Назад</a>
  </p>
</section>

{% endblock %}
